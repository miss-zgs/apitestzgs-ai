<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>API 测试 Agent</title>
<style>
/* ========== 全局样式 ========== */
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #0f1117;
  --bg-secondary: #1a1b26;
  --bg-input: #24253a;
  --border: #2e2f45;
  --text: #e0e0e0;
  --text-secondary: #8888a0;
  --accent: #7c6cf0;
  --accent-hover: #6a5bd6;
  --success: #4ade80;
  --danger: #f87171;
  --warning: #fbbf24;
  --radius: 12px;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ========== 顶部导航栏 ========== */
.navbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 24px;
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.navbar-brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 18px;
  font-weight: 600;
}

.navbar-brand .icon { font-size: 24px; }

.navbar-actions {
  display: flex;
  gap: 8px;
  align-items: center;
}

.status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--success);
  display: inline-block;
  margin-right: 6px;
}

.status-dot.offline { background: var(--danger); }
.status-dot.loading { background: var(--warning); animation: pulse 1s infinite; }

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

.btn {
  padding: 6px 14px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: transparent;
  color: var(--text-secondary);
  cursor: pointer;
  font-size: 13px;
  transition: all 0.2s;
}

.btn:hover { border-color: var(--accent); color: var(--text); }
.btn-danger:hover { border-color: var(--danger); color: var(--danger); }

/* ========== 聊天主体区域 ========== */
.chat-container {
  flex: 1;
  overflow-y: auto;
  padding: 20px 0;
  scroll-behavior: smooth;
}

.chat-inner {
  max-width: 820px;
  margin: 0 auto;
  padding: 0 20px;
}

/* 欢迎区域 */
.welcome {
  text-align: center;
  padding: 60px 20px;
}

.welcome h2 {
  font-size: 28px;
  margin-bottom: 12px;
  background: linear-gradient(135deg, var(--accent), #a78bfa);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.welcome p {
  color: var(--text-secondary);
  margin-bottom: 24px;
  line-height: 1.6;
}

.quick-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: center;
}

.quick-btn {
  padding: 10px 16px;
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text-secondary);
  cursor: pointer;
  font-size: 13px;
  transition: all 0.2s;
}

.quick-btn:hover {
  border-color: var(--accent);
  color: var(--text);
  transform: translateY(-1px);
}

/* 消息气泡 */
.message {
  display: flex;
  gap: 12px;
  margin-bottom: 20px;
  animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.message-avatar {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  flex-shrink: 0;
  margin-top: 2px;
}

.message.user .message-avatar { background: var(--accent); }
.message.assistant .message-avatar { background: #2d2e44; }

.message-content {
  flex: 1;
  min-width: 0;
}

.message-role {
  font-size: 12px;
  color: var(--text-secondary);
  margin-bottom: 4px;
  font-weight: 500;
}

.message-body {
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 18px;
  line-height: 1.7;
  font-size: 14px;
  white-space: pre-wrap;
  word-break: break-word;
  overflow-x: auto;
}

.message.user .message-body {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}

/* 思考中动画 */
.thinking-dots {
  display: inline-flex;
  gap: 4px;
  padding: 4px 0;
}

.thinking-dots span {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--text-secondary);
  animation: bounce 1.2s infinite;
}

.thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
.thinking-dots span:nth-child(3) { animation-delay: 0.4s; }

@keyframes bounce {
  0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
  40% { transform: scale(1); opacity: 1; }
}

/* ========== 输入区域 ========== */
.input-area {
  padding: 16px 20px 20px;
  background: var(--bg);
  flex-shrink: 0;
}

.input-inner {
  max-width: 820px;
  margin: 0 auto;
  display: flex;
  gap: 10px;
  align-items: flex-end;
}

.input-wrapper {
  flex: 1;
  position: relative;
}

.input-wrapper textarea {
  width: 100%;
  min-height: 48px;
  max-height: 160px;
  padding: 12px 16px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font-size: 14px;
  font-family: inherit;
  resize: none;
  outline: none;
  transition: border-color 0.2s;
  line-height: 1.5;
}

.input-wrapper textarea:focus { border-color: var(--accent); }

.input-wrapper textarea::placeholder { color: var(--text-secondary); }

.send-btn {
  width: 48px;
  height: 48px;
  border: none;
  border-radius: var(--radius);
  background: var(--accent);
  color: #fff;
  font-size: 20px;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.send-btn:hover { background: var(--accent-hover); }
.send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

/* ========== 侧边栏（工具列表） ========== */
.sidebar-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.5);
  z-index: 100;
  display: none;
  animation: fadeIn 0.2s;
}

.sidebar-overlay.active { display: block; }

.sidebar {
  position: fixed;
  top: 0;
  right: -360px;
  width: 360px;
  height: 100%;
  background: var(--bg-secondary);
  border-left: 1px solid var(--border);
  z-index: 101;
  transition: right 0.3s ease;
  display: flex;
  flex-direction: column;
}

.sidebar.active { right: 0; }

.sidebar-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
}

.sidebar-header h3 { font-size: 16px; }

.sidebar-close {
  background: none;
  border: none;
  color: var(--text-secondary);
  font-size: 20px;
  cursor: pointer;
}

.sidebar-body {
  flex: 1;
  overflow-y: auto;
  padding: 16px 20px;
}

.tool-card {
  padding: 12px 14px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  margin-bottom: 10px;
}

.tool-card h4 {
  font-size: 13px;
  color: var(--accent);
  margin-bottom: 6px;
}

.tool-card p {
  font-size: 12px;
  color: var(--text-secondary);
  line-height: 1.5;
}

/* ========== 底部信息 ========== */
.input-hint {
  text-align: center;
  font-size: 11px;
  color: var(--text-secondary);
  margin-top: 8px;
  max-width: 820px;
  margin-left: auto;
  margin-right: auto;
}

/* ========== 滚动条 ========== */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #444; }

/* ========== 文件上传 ========== */
.upload-btn {
  width: 48px;
  height: 48px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: transparent;
  color: var(--text-secondary);
  font-size: 20px;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.upload-btn:hover { border-color: var(--accent); color: var(--text); }

.file-preview-bar {
  max-width: 820px;
  margin: 0 auto 8px;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.file-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 12px;
  color: var(--text-secondary);
  animation: fadeIn 0.2s ease;
}

.file-chip .file-icon { font-size: 14px; }
.file-chip .file-name { max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file-chip .file-size { color: var(--text-secondary); opacity: 0.7; }

.file-chip .remove-file {
  background: none;
  border: none;
  color: var(--text-secondary);
  font-size: 14px;
  cursor: pointer;
  padding: 0 2px;
  line-height: 1;
}

.file-chip .remove-file:hover { color: var(--danger); }

.file-chip.uploading { border-color: var(--warning); }
.file-chip.uploaded { border-color: var(--success); }
.file-chip.error { border-color: var(--danger); }

/* 文件管理面板 */
.file-list-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 14px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  margin-bottom: 8px;
}

.file-list-info {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}

.file-list-info span:first-child { font-size: 18px; }

.file-list-name {
  font-size: 13px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.file-list-size {
  font-size: 11px;
  color: var(--text-secondary);
}

.file-list-actions { display: flex; gap: 6px; }

.file-list-actions button {
  background: none;
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text-secondary);
  font-size: 12px;
  padding: 4px 8px;
  cursor: pointer;
  transition: all 0.2s;
}

.file-list-actions button:hover { border-color: var(--danger); color: var(--danger); }
</style>
</head>
<body>

<!-- 顶部导航栏 -->
<nav class="navbar">
  <div class="navbar-brand">
    <span class="icon">🤖</span>
    <span>API 测试 Agent</span>
  </div>
  <div class="navbar-actions">
    <span id="statusIndicator"><span class="status-dot loading"></span>连接中...</span>
    <button class="btn" onclick="showFiles()">📂 文件</button>
    <button class="btn" onclick="showTools()">🔧 工具集</button>
    <button class="btn btn-danger" onclick="clearHistory()">🗑 清空</button>
  </div>
</nav>

<!-- 聊天主体 -->
<div class="chat-container" id="chatContainer">
  <div class="chat-inner" id="chatInner">
    <!-- 欢迎区域 -->
    <div class="welcome" id="welcomeArea">
      <h2>🧪 API 测试 Agent</h2>
      <p>用自然语言描述你的测试需求，Agent 会自动规划并执行测试</p>
      <div class="quick-actions">
        <button class="quick-btn" onclick="sendQuick('列出 data/ 目录下有哪些测试数据文件')">📂 查看数据文件</button>
        <button class="quick-btn" onclick="sendQuick('加载 data/11.yaml 并执行所有用例，生成报告')">▶️ 执行 11.yaml</button>
        <button class="quick-btn" onclick="sendQuick('帮我测试 https://httpbin.org/get 接口，验证返回 200')">🔗 快速测试</button>
        <button class="quick-btn" onclick="sendQuick('查看当前项目的配置信息')">⚙️ 查看配置</button>
      </div>
    </div>
  </div>
</div>

<!-- 输入区域 -->
<div class="input-area">
  <div class="file-preview-bar" id="filePreviewBar"></div>
  <div class="input-inner">
    <input type="file" id="fileInput" multiple hidden onchange="handleFileSelect(event)">
    <button class="upload-btn" onclick="document.getElementById('fileInput').click()" title="上传文件到 data/ 目录">📎</button>
    <div class="input-wrapper">
      <textarea id="messageInput"
                placeholder="描述你的测试需求，如：加载 data/11.yaml 执行全部用例并生成报告"
                rows="1"
                onkeydown="handleKeydown(event)"
                oninput="autoResize(this)"></textarea>
    </div>
    <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
  </div>
  <div class="input-hint">按 Enter 发送，Shift + Enter 换行 · 点击 📎 上传文件到 data/ 目录</div>
</div>

<!-- 工具集侧边栏 -->
<div class="sidebar-overlay" id="sidebarOverlay" onclick="hideTools()"></div>
<div class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <h3>🔧 Agent 工具集</h3>
    <button class="sidebar-close" onclick="hideTools()">✕</button>
  </div>
  <div class="sidebar-body" id="toolsList">
    <p style="color: var(--text-secondary)">加载中...</p>
  </div>
</div>

<!-- 文件管理侧边栏 -->
<div class="sidebar-overlay" id="fileSidebarOverlay" onclick="hideFiles()"></div>
<div class="sidebar" id="fileSidebar">
  <div class="sidebar-header">
    <h3>📂 data/ 文件管理</h3>
    <button class="sidebar-close" onclick="hideFiles()">✕</button>
  </div>
  <div class="sidebar-body">
    <button class="btn" style="width:100%;margin-bottom:14px;padding:10px" onclick="document.getElementById('fileSidebarInput').click()">📎 上传文件</button>
    <input type="file" id="fileSidebarInput" multiple hidden onchange="handleSidebarUpload(event)">
    <div id="fileListContainer">
      <p style="color: var(--text-secondary)">加载中...</p>
    </div>
  </div>
</div>

<script>
// ==================== 配置 ====================
const API_BASE = window.location.origin;
const API_KEY = '';  // 如需认证，填入 API Key

function getHeaders() {
  const headers = { 'Content-Type': 'application/json' };
  if (API_KEY) headers['X-API-Key'] = API_KEY;
  return headers;
}

// ==================== 状态管理 ====================
let isStreaming = false;
let messageHistory = [];

// ==================== 初始化 ====================
document.addEventListener('DOMContentLoaded', () => {
  checkStatus();
  document.getElementById('messageInput').focus();
});

// ==================== Agent 状态检查 ====================
async function checkStatus() {
  const indicator = document.getElementById('statusIndicator');
  try {
    const response = await fetch(`${API_BASE}/status`, { headers: getHeaders() });
    if (response.ok) {
      const data = await response.json();
      indicator.innerHTML = `<span class="status-dot"></span>${data.env} · ${data.model}`;
    } else {
      indicator.innerHTML = '<span class="status-dot offline"></span>连接失败';
    }
  } catch {
    indicator.innerHTML = '<span class="status-dot offline"></span>服务未启动';
  }
}

// ==================== 发送消息 ====================
async function sendMessage() {
  const input = document.getElementById('messageInput');
  const message = input.value.trim();
  if (!message || isStreaming) return;

  // 隐藏欢迎区域
  const welcome = document.getElementById('welcomeArea');
  if (welcome) welcome.style.display = 'none';

  // 添加用户消息
  appendMessage('user', message);
  input.value = '';
  autoResize(input);

  // 添加 Agent 思考中占位
  const assistantId = appendMessage('assistant', '', true);

  isStreaming = true;
  updateSendButton();

  try {
    const response = await fetch(`${API_BASE}/chat-stream`, {
      method: 'POST',
      headers: getHeaders(),
      body: JSON.stringify({ message }),
    });

    if (!response.ok) {
      throw new Error(`HTTP ${response.status}: ${response.statusText}`);
    }

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let fullContent = '';
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const data = line.slice(6);
        if (data === '[DONE]') continue;

        // 后端将换行转义为字面 \n（反斜杠+n），前端还原为真正换行
        fullContent += data.split('\\n').join('\n');
        updateMessage(assistantId, fullContent.trimEnd());
      }
    }

    if (!fullContent) {
      updateMessage(assistantId, '⚠️ Agent 未返回内容');
    }
  } catch (error) {
    updateMessage(assistantId, `❌ 请求失败: ${error.message}\n\n请确认 Agent API 服务是否已启动（python3 agent_api.py）`);
  } finally {
    isStreaming = false;
    updateSendButton();
  }
}

// ==================== 快捷指令 ====================
function sendQuick(text) {
  document.getElementById('messageInput').value = text;
  sendMessage();
}

// ==================== 消息渲染 ====================
function appendMessage(role, content, isThinking = false) {
  const container = document.getElementById('chatInner');
  const messageId = `msg-${Date.now()}`;

  const avatar = role === 'user' ? '👤' : '🤖';
  const roleLabel = role === 'user' ? '你' : 'Agent';
  const bodyContent = isThinking
    ? '<div class="thinking-dots"><span></span><span></span><span></span></div>'
    : escapeHtml(content);

  const messageDiv = document.createElement('div');
  messageDiv.className = `message ${role}`;
  messageDiv.id = messageId;
  messageDiv.innerHTML = `
    <div class="message-avatar">${avatar}</div>
    <div class="message-content">
      <div class="message-role">${roleLabel}</div>
      <div class="message-body">${bodyContent}</div>
    </div>
  `;

  container.appendChild(messageDiv);
  scrollToBottom();
  return messageId;
}

function updateMessage(messageId, content) {
  const messageDiv = document.getElementById(messageId);
  if (!messageDiv) return;
  const body = messageDiv.querySelector('.message-body');
  body.textContent = content;
  scrollToBottom();
}

// ==================== 清空对话 ====================
async function clearHistory() {
  try {
    await fetch(`${API_BASE}/clear`, {
      method: 'POST',
      headers: getHeaders(),
    });
  } catch { /* 忽略 */ }

  const container = document.getElementById('chatInner');
  container.innerHTML = '';

  // 恢复欢迎区域
  const welcome = document.createElement('div');
  welcome.className = 'welcome';
  welcome.id = 'welcomeArea';
  welcome.innerHTML = `
    <h2>🧪 API 测试 Agent</h2>
    <p>用自然语言描述你的测试需求，Agent 会自动规划并执行测试</p>
    <div class="quick-actions">
      <button class="quick-btn" onclick="sendQuick('列出 data/ 目录下有哪些测试数据文件')">📂 查看数据文件</button>
      <button class="quick-btn" onclick="sendQuick('加载 data/11.yaml 并执行所有用例，生成报告')">▶️ 执行 11.yaml</button>
      <button class="quick-btn" onclick="sendQuick('帮我测试 https://httpbin.org/get 接口，验证返回 200')">🔗 快速测试</button>
      <button class="quick-btn" onclick="sendQuick('查看当前项目的配置信息')">⚙️ 查看配置</button>
    </div>
  `;
  container.appendChild(welcome);
}

// ==================== 工具集侧边栏 ====================
async function showTools() {
  document.getElementById('sidebarOverlay').classList.add('active');
  document.getElementById('sidebar').classList.add('active');

  try {
    const response = await fetch(`${API_BASE}/tools`, { headers: getHeaders() });
    const data = await response.json();
    const toolsList = document.getElementById('toolsList');
    toolsList.innerHTML = data.tools.map(tool => `
      <div class="tool-card">
        <h4>${tool.name}</h4>
        <p>${tool.description.split('\n')[0]}</p>
      </div>
    `).join('');
  } catch {
    document.getElementById('toolsList').innerHTML =
      '<p style="color: var(--danger)">加载失败，请确认服务已启动</p>';
  }
}

function hideTools() {
  document.getElementById('sidebarOverlay').classList.remove('active');
  document.getElementById('sidebar').classList.remove('active');
}

// ==================== 辅助函数 ====================
function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function scrollToBottom() {
  const container = document.getElementById('chatContainer');
  requestAnimationFrame(() => {
    container.scrollTop = container.scrollHeight;
  });
}

function autoResize(textarea) {
  textarea.style.height = 'auto';
  textarea.style.height = Math.min(textarea.scrollHeight, 160) + 'px';
}

function handleKeydown(event) {
  if (event.key === 'Enter' && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
}

function updateSendButton() {
  const btn = document.getElementById('sendBtn');
  btn.disabled = isStreaming;
  btn.textContent = isStreaming ? '⏳' : '➤';
}

// ==================== 文件上传 ====================
let pendingFiles = [];  // 待上传/已上传的文件列表

function getFileIcon(filename) {
  const ext = filename.split('.').pop().toLowerCase();
  const iconMap = {
    yaml: '📋', yml: '📋', json: '📋', csv: '📊', xml: '📋',
    xlsx: '📊', xls: '📊', doc: '📄', docx: '📄', pdf: '📕',
    png: '🖼️', jpg: '🖼️', jpeg: '🖼️', gif: '🖼️', webp: '🖼️', svg: '🖼️',
    zip: '📦', tar: '📦', gz: '📦', rar: '📦',
    txt: '📝', mp4: '🎬', mp3: '🎵', wav: '🎵',
  };
  return iconMap[ext] || '📎';
}

function handleFileSelect(event) {
  const files = Array.from(event.target.files);
  if (!files.length) return;
  files.forEach(file => uploadAndTrack(file));
  event.target.value = '';
}

function handleSidebarUpload(event) {
  const files = Array.from(event.target.files);
  if (!files.length) return;
  files.forEach(file => uploadAndTrack(file));
  event.target.value = '';
  setTimeout(refreshFileList, 1500);
}

async function uploadAndTrack(file) {
  const fileId = `file-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`;
  const sizeStr = file.size < 1024 * 1024
    ? `${(file.size / 1024).toFixed(1)}KB`
    : `${(file.size / 1024 / 1024).toFixed(1)}MB`;

  pendingFiles.push({ id: fileId, name: file.name, size: sizeStr, status: 'uploading' });
  renderFilePreview();

  try {
    const formData = new FormData();
    formData.append('file', file);
    const headers = {};
    if (API_KEY) headers['X-API-Key'] = API_KEY;

    const response = await fetch(`${API_BASE}/upload`, {
      method: 'POST',
      headers,
      body: formData,
    });

    if (!response.ok) {
      const errorData = await response.json().catch(() => ({ detail: response.statusText }));
      throw new Error(errorData.detail || `HTTP ${response.status}`);
    }

    const result = await response.json();
    const entry = pendingFiles.find(f => f.id === fileId);
    if (entry) {
      entry.status = 'uploaded';
      entry.serverName = result.filename;
    }
    renderFilePreview();
  } catch (error) {
    const entry = pendingFiles.find(f => f.id === fileId);
    if (entry) {
      entry.status = 'error';
      entry.error = error.message;
    }
    renderFilePreview();
  }
}

function renderFilePreview() {
  const bar = document.getElementById('filePreviewBar');
  if (!pendingFiles.length) {
    bar.innerHTML = '';
    return;
  }

  bar.innerHTML = pendingFiles.map(file => {
    const statusClass = file.status === 'uploading' ? 'uploading' : file.status === 'uploaded' ? 'uploaded' : 'error';
    const statusIcon = file.status === 'uploading' ? '⏳' : file.status === 'uploaded' ? '✅' : '❌';
    const title = file.status === 'error' ? file.error : file.status === 'uploaded' ? `已上传到 data/${file.serverName || file.name}` : '上传中...';
    return `<div class="file-chip ${statusClass}" title="${title}">
      <span class="file-icon">${getFileIcon(file.name)}</span>
      <span class="file-name">${file.name}</span>
      <span class="file-size">${file.size}</span>
      <span>${statusIcon}</span>
      <button class="remove-file" onclick="removeFileChip('${file.id}')">✕</button>
    </div>`;
  }).join('');
}

function removeFileChip(fileId) {
  pendingFiles = pendingFiles.filter(f => f.id !== fileId);
  renderFilePreview();
}

// ==================== 文件管理侧边栏 ====================
function showFiles() {
  document.getElementById('fileSidebarOverlay').classList.add('active');
  document.getElementById('fileSidebar').classList.add('active');
  refreshFileList();
}

function hideFiles() {
  document.getElementById('fileSidebarOverlay').classList.remove('active');
  document.getElementById('fileSidebar').classList.remove('active');
}

async function refreshFileList() {
  const container = document.getElementById('fileListContainer');
  try {
    const response = await fetch(`${API_BASE}/files`, { headers: getHeaders() });
    const data = await response.json();

    if (!data.files.length) {
      container.innerHTML = '<p style="color: var(--text-secondary); text-align: center; padding: 20px 0">暂无文件，点击上方按钮上传</p>';
      return;
    }

    container.innerHTML = data.files.map(file => `
      <div class="file-list-item">
        <div class="file-list-info">
          <span>${getFileIcon(file.name)}</span>
          <div>
            <div class="file-list-name">${file.name}</div>
            <div class="file-list-size">${file.size}</div>
          </div>
        </div>
        <div class="file-list-actions">
          <button onclick="useFileInChat('${file.name}')">💬 使用</button>
          <button onclick="deleteFile('${file.name}')">🗑</button>
        </div>
      </div>
    `).join('');
  } catch {
    container.innerHTML = '<p style="color: var(--danger)">加载失败，请确认服务已启动</p>';
  }
}

function useFileInChat(filename) {
  hideFiles();
  const input = document.getElementById('messageInput');
  input.value = `加载 data/${filename} 中的所有用例并执行测试，测试完成后生成报告`;
  input.focus();
}

async function deleteFile(filename) {
  if (!confirm(`确认删除 data/${filename}？`)) return;
  try {
    await fetch(`${API_BASE}/files/${encodeURIComponent(filename)}`, {
      method: 'DELETE',
      headers: getHeaders(),
    });
    refreshFileList();
  } catch {
    alert('删除失败');
  }
}
</script>
