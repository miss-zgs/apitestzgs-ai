# 环境配置
# base_url: 被测接口的基础地址，所有 API 请求会基于此地址发起
# test 环境默认使用 jsonplaceholder.typicode.com（免费公共测试 API，仅用于演示，无需真实后端）
# 请根据实际情况替换为你们的真实接口地址
environments:
  dev:
    base_url: "https://dev-api.example.com"  # 开发环境，请替换为实际地址
    timeout: 30
  test:
    base_url: "https://jsonplaceholder.typicode.com"  # 演示用公共测试 API
    timeout: 30
  pre:
    base_url: "https://pre-api.example.com"  # 预发环境，请替换为实际地址
    timeout: 30
  prod:
    base_url: "https://api.example.com"  # 生产环境，请替换为实际地址
    timeout: 30

# 当前使用的环境
current_env: "test"

# 全局请求配置
request:
  timeout: 30
  retry_count: 2
  retry_interval: 1
  verify_ssl: false

# 日志配置
logging:
  level: "DEBUG"
  format: "%(asctime)s [%(levelname)s] %(name)s - %(message)s"
  show_data_loader: false   # 是否显示数据加载日志（true=显示，false=隐藏）
